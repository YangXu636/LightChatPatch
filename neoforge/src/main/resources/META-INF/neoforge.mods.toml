[[mods]]
modId = "light_chat_patch"
version = "${version}"
displayName = "Light Chat Patch"
authors = "XuYangJerry"
description = '''
Improvements for the Minecraft chat system: copy/reply/+1 on messages, extended cross-world chat input history, and draft preservation when closing the chat screen or quitting the game.
'''
displayURL = "https://github.com/XuYangJerry/LightChatPatch"
modUrl = "https://github.com/XuYangJerry/LightChatPatch"
#logoFile = ""

[features.light_chat_patch]
javaVersion = "[21,)"

[[dependencies.light_chat_patch]]
